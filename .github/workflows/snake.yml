name: generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: trigger github-stats update
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run update.yml --repo xinitkey/github-stats
          else
            echo "skip: no ACCESS_TOKEN secret set"
          fi

      - name: generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: generate trophy
        uses: ryo-ma/github-profile-trophy@v0.7.0
        with:
          username: ${{ github.repository_owner }}
          output: trophy.svg
          no-frame: true
          no-bg: true

      - name: commit trophy svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "update trophy svg"

      - name: generate pinned project cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 generate_card.py "xinitkey" "xinitkey/xinitkey"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'card-*.svg' README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "update pinned project cards"

      - name: push all changes
        run: |
          git pull --rebase origin main
          git push
